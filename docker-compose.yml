services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamplanning
      POSTGRES_PASSWORD: teamplanning
      POSTGRES_DB: teamplanning
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamplanning"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://teamplanning:teamplanning@db:5432/teamplanning
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@teamplanning.nl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      TEAM_ACCESS_PASSWORD: ${TEAM_ACCESS_PASSWORD:-degouv}
      TEAMBEHEER_AUTO_SYNC: ${TEAMBEHEER_AUTO_SYNC:-true}
      TEAMBEHEER_SYNC_HOUR: ${TEAMBEHEER_SYNC_HOUR:-3}
      TEAMBEHEER_SYNC_MINUTE: ${TEAMBEHEER_SYNC_MINUTE:-30}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL:-mailto:info@degouv.nl}
    # Geen ports hier: alleen frontend praat met de backend, over het interne
    # Docker-netwerk (http://backend:8000). Niets van de backend hoeft
    # rechtstreeks vanaf het internet bereikbaar te zijn.

  frontend:
    build:
      context: ./frontend
      args:
        # Next.js lost rewrites() (zie frontend/next.config.mjs) op tijdens
        # `next build`, niet opnieuw bij het opstarten van de server. Deze
        # env vars moeten dus als build-arg mee, een `environment:`-waarde
        # hieronder zou genegeerd worden.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
